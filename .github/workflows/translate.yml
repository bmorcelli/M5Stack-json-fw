name: Translate firmware catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */6 * * *"

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install deep-translator requests

      - name: Run translator
        run: |
          # Stops cleanly after the budget; progress is kept in the cache
          # and the next scheduled run continues from there.
          python v2/translate.py v2/all_device_firmware.json --max-minutes 40

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          for i in 1 2 3; do
            git add .
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Update translated catalog"
            git push && exit 0
            # main moved (Database Update pushed). Rebuild on top of it,
            # reapplying translations from the cache (no new requests needed).
            cp v2/translation_cache.json "$RUNNER_TEMP/cache.json"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/cache.json" v2/translation_cache.json
            python v2/translate.py v2/all_device_firmware.json --max-minutes 5
          done
          exit 1
